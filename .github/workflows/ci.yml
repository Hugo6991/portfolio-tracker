name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - run: node scripts/make-demo-data.mjs --out /tmp/demo && test -f /tmp/demo/data/portfolio.json
      - run: PORTFOLIO_DEMO_MODE=1 npm run build
